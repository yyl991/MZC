<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>捡手机｜微信版</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}
:root{
  --mask:rgba(0,0,0,0.36);
  --nav-bg:rgba(0,0,0,0.12);
  --bg-other:#ffffff;
  --color-other:#333333;
  --bg-self:#95ec69;
  --color-self:#222;
  --input-bg:rgba(255,255,255,0.94);
  --input-text:#222;
}
.dark{
  --mask:rgba(0,0,0,0.65);
  --nav-bg:rgba(0,0,0,0.45);
  --bg-other:#2c2c2c;
  --color-other:#eee;
  --bg-self:#07c160;
  --color-self:#fff;
  --input-bg:rgba(45,45,45,0.94);
  --input-text:#fff;
}
html,body{
  min-height:100vh;
  background:#000;
}
body{
  background-image:url("./bg.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size:15px;
  line-height:1.5;
  padding-top:88px;
  padding-bottom:76px;
  transition:0.3s;
}
.mask{
  position:fixed;
  inset:0;
  background:var(--mask);
  z-index:-1;
}
.status-bar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:34px;
  color:#fff;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  z-index:20;
}
.nav-bar{
  position:fixed;
  top:34px;
  left:0;
  width:100%;
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:var(--nav-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color:#fff;
  z-index:19;
}
.nav-back{
  color:#57a6ff;
  font-size:16px;
}
.nav-title{
  font-weight:500;
  font-size:17px;
}
.nav-dark-toggle{
  color:#57a6ff;
  font-size:15px;
}
.wrap{
  max-width:460px;
  margin:0 auto;
  padding:0 14px;
  padding-bottom:20px;
}
.msg{
  margin:8px 0;
  display:flex;
  will-change: transform, opacity;
}
.msg.left{
  justify-content:flex-start;
}
.msg.right{
  justify-content:flex-end;
}
.msg.left .bubble{
  background:var(--bg-other);
  color:var(--color-other);
  border-radius:18px 18px 18px 4px;
}
.msg.right .bubble{
  background:var(--bg-self);
  color:var(--color-self);
  border-radius:18px 18px 4px 18px;
}
.bubble{
  max-width:72%;
  padding:10px 12px;
  word-break:break-all;
  position:relative;
  cursor:pointer;
  user-select:text;
  transition:0.15s;
}
.bubble.highlight{
  filter:brightness(1.15);
}
.bubble img{
  max-width:100%;
  border-radius:10px;
  display:block;
}
.name{
  font-size:12px;
  opacity:0.8;
  margin-bottom:3px;
  padding-left:4px;
  color:#fff;
}
.time{
  font-size:10px;
  opacity:0.55;
  margin-top:4px;
  text-align:right;
  color:#fff;
}
.msg.in-anim{
  opacity:0;
  transform: translateY(10px);
  animation:msgIn 0.3s ease forwards;
}
@keyframes msgIn{
  to{opacity:1;transform:translateY(0);}
}
.msg.send-anim{
  opacity:0;
  transform: translate(10px,10px) scale(0.96);
  animation:msgSend 0.3s ease forwards;
}
@keyframes msgSend{
  to{opacity:1;transform: translate(0,0) scale(1);}
}
.typing-wrap{
  display:flex;
  justify-content:flex-start;
  margin:8px 0;
  padding-left:4px;
}
.typing{
  background:var(--bg-other);
  border-radius:18px;
  padding:12px 14px;
  display:flex;
  gap:4px;
}
.dot{
  width:7px;
  height:7px;
  border-radius:99px;
  background:#999;
  animation:bounce 1.4s infinite ease-in-out;
}
.dot:nth-child(1){animation-delay:0s;}
.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{
  0%,80%,100%{transform:translateY(0);}
  40%{transform:translateY(-6px);}
}
.context-menu{
  position:fixed;
  background:rgba(30,30,30,0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius:12px;
  overflow:hidden;
  z-index:999;
  color:#fff;
  display:none;
  min-width:110px;
}
.context-menu.show{
  display:block;
}
.menu-item{
  padding:10px 14px;
  font-size:15px;
  text-align:center;
}
.menu-item:active{
  background:rgba(255,255,255,0.12);
}
.toast{
  position:fixed;
  left:50%;
  bottom:140px;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.72);
  color:#fff;
  padding:7px 16px;
  border-radius:999px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:0.22s;
  z-index:99;
}
.toast.show{opacity:1;}
.load-more-tip{
  text-align:center;
  color:#fff;
  opacity:0.7;
  font-size:13px;
  padding:10px;
  display:none;
}
.load-more-tip.show{display:block;}
.input-bar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  padding:8px 12px;
  padding-bottom:max(8px, env(safe-area-inset-bottom));
  background:rgba(20,20,20,0.65);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display:flex;
  gap:8px;
  align-items:center;
  z-index:18;
}
.input-bar input{
  flex:1;
  border:none;
  outline:none;
  border-radius:20px;
  padding:10px 16px;
  background:var(--input-bg);
  color:var(--input-text);
  font-size:16px;
}
.send-btn{
  background:#07c160;
  color:#fff;
  border:none;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:16px;
}
</style>
</head>
<body>
<div class="mask"></div>
<div class="status-bar">
  <span>17:05</span>
  <span>📶 🔋</span>
</div>
<div class="nav-bar">
  <div class="nav-back">‹ 返回</div>
  <div class="nav-title">联系人名字</div>
  <div class="nav-dark-toggle" id="darkBtn">深色</div>
</div>

<div class="wrap" id="msgWrap">
  <div class="load-more-tip" id="loadTip">加载更多消息…</div>

  <div class="msg left in-anim">
    <div>
      <div class="name">联系人名字</div>
      <div class="bubble">微信风格捡手机页面，气泡是微信经典样式</div>
      <div class="time">17:03</div>
    </div>
  </div>
  <div class="msg left in-anim">
    <div>
      <div class="name">联系人名字</div>
      <div class="bubble"><img src="./test.png" alt="图片"></div>
      <div class="time">17:04</div>
    </div>
  </div>
  <div class="msg right send-anim">
    <div>
      <div class="bubble">收到啦！</div>
      <div class="time">17:04</div>
    </div>
  </div>

  <div class="typing-wrap" id="typingBox" style="display:none;">
    <div class="typing">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>

<div class="context-menu" id="ctxMenu">
  <div class="menu-item" data-action="copy">复制</div>
</div>
<div class="toast" id="toast">已复制</div>

<div class="input-bar">
  <input id="msgInput" placeholder="输入消息">
  <button class="send-btn" id="sendBtn">➤</button>
</div>

<script>
const msgWrap = document.getElementById('msgWrap');
const toast = document.getElementById('toast');
const ctxMenu = document.getElementById('ctxMenu');
const typingBox = document.getElementById('typingBox');
const loadTip = document.getElementById('loadTip');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const darkBtn = document.getElementById('darkBtn');

let currentBubbleText = '';
let loading = false;

const historyPool = [
  {side:"left",name:"联系人名字",text:"更早的历史消息1",time:"16:50"},
  {side:"right",text:"更早的回复消息",time:"16:51"},
  {side:"left",name:"联系人名字",text:"很久之前的对话",time:"16:52"}
];

darkBtn.onclick = ()=>{
  document.body.classList.toggle('dark');
  darkBtn.innerText = document.body.classList.contains('dark') ? '浅色' : '深色';
}

function addMessage(side, name, text, time, animClass){
  const div = document.createElement('div');
  div.className = `msg ${side} ${animClass}`;
  if(side === 'left'){
    div.innerHTML = `
      <div>
        <div class="name">${name}</div>
        <div class="bubble">${text}</div>
        <div class="time">${time}</div>
      </div>
    `;
  }else{
    div.innerHTML = `
      <div>
        <div class="bubble">${text}</div>
        <div class="time">${time}</div>
      </div>
    `;
  }
  const bubble = div.querySelector('.bubble');
  bindBubbleEvent(bubble);
  msgWrap.appendChild(div);
  msgWrap.scrollTop = msgWrap.scrollHeight;
  return div;
}

function bindBubbleEvent(bubble){
  let pressTimer = null;
  bubble.addEventListener('mousedown',()=>{
    bubble.classList.add('highlight');
    pressTimer = setTimeout(()=>showMenu(bubble), 420);
  })
  bubble.addEventListener('mouseup',()=>{
    bubble.classList.remove('highlight');
    clearTimeout(pressTimer);
  })
  bubble.addEventListener('mouseleave',()=>{
    bubble.classList.remove('highlight');
    clearTimeout(pressTimer);
  })
  bubble.addEventListener('touchstart',(e)=>{
    bubble.classList.add('highlight');
    pressTimer = setTimeout(()=>showMenu(bubble, e.touches[0]), 420);
  })
  bubble.addEventListener('touchend',()=>{
    bubble.classList.remove('highlight');
    clearTimeout(pressTimer);
  })
  bubble.addEventListener('touchcancel',()=>{
    bubble.classList.remove('highlight');
    clearTimeout(pressTimer);
  })
  bubble.addEventListener('click',async ()=>{
    const txt = bubble.innerText.trim();
    try{
      await navigator.clipboard.writeText(txt);
      showToast();
    }catch(err){
      alert("复制失败");
    }
  })
}

function showMenu(bubble, touch){
  currentBubbleText = bubble.innerText.trim();
  ctxMenu.style.left = (touch ? touch.clientX : event.clientX)+'px';
  ctxMenu.style.top = (touch ? touch.clientY : event.clientY)+'px';
  ctxMenu.classList.add('show');
}
document.addEventListener('click',(e)=>{
  if(!ctxMenu.contains(e.target)) ctxMenu.classList.remove('show');
})
ctxMenu.querySelector('[data-action="copy"]').onclick = async ()=>{
  await navigator.clipboard.writeText(currentBubbleText);
  showToast();
  ctxMenu.classList.remove('show');
}

function showToast(){
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1100);
}

msgWrap.addEventListener('scroll',async ()=>{
  if(loading) return;
  if(msgWrap.scrollTop < 30){
    loading = true;
    loadTip.classList.add('show');
    await new Promise(r=>setTimeout(r,700));
    loadTip.classList.remove('show');
    if(historyPool.length>0){
      const item = historyPool.shift();
      const m = addMessage(item.side, item.name, item.text, item.time, 'in-anim');
      msgWrap.insertBefore(m, msgWrap.children[1]);
    }
    loading = false;
  }
})

function showTyping(){ typingBox.style.display = 'flex'; }
function hideTyping(){ typingBox.style.display = 'none'; }

function sendMsg(){
  const val = msgInput.value.trim();
  if(!val) return;
  const t = new Date();
  const now = `${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
  addMessage("right", "", val, now, "send-anim");
  msgInput.value = "";
}
sendBtn.onclick = sendMsg;
msgInput.onkeydown = e=>{if(e.key==='Enter') sendMsg();}
</script>
</body>
</html>
