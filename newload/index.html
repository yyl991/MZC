<body>
    <!-- 👇 新增：全屏绝对遮罩层（防白块专用） -->
    <div id="loading-overlay" style="position:fixed; inset:0; z-index:9999999; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; transition: opacity 0.5s;">
        <div style="color:#fff; font-size:16px; text-align:center; line-height:1.8; letter-spacing:1px;">
            等下等下 等下 等下等下<br>等等等等等等…等下<br>哎别这么着急好不好😿
        </div>
    </div>

    <div id="phone">
        <div id="screen">
            <!-- 原来的 boot 保留，但会被上方的遮罩挡住 -->
            <div id="boot"><span>等下等下 等下 等下等下<br>等等等等等等…等下<br>哎别这么着急好不好😿</span></div>
            <div id="wall"></div>
            <div id="homeL" class="layer"></div>
            <div id="lockL" class="layer">
                <div id="lkc"></div>
                <div id="pinL"></div>
            </div>
            <div id="appL" class="layer"></div>
            <div id="ov"></div>
        </div>
        <div id="sb" class="light">
            <button id="sbk" aria-label="Home"></button>
            <span class="t" id="sbt">23:09</span>
            <span class="r">
                <svg width="18" height="12" viewBox="0 0 18 12">
                    <rect x="0" y="8" width="3" height="4" rx="1" />
                    <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
                    <rect x="10" y="3" width="3" height="9" rx="1" />
                    <rect x="15" y="0" width="3" height="12" rx="1" />
                </svg>
                <svg width="16" height="12" viewBox="0 0 16 12">
                    <path
                        d="M8 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.3 10.3 0 0 0 8 .6 10.3 10.3 0 0 0 .8 3.5L2 4.7a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 4a6.8 6.8 0 0 0-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.4c-.6 0-1.2.2-1.6.6L8 11.3l1.6-1.6c-.4-.4-1-.6-1.6-.6Z" />
                </svg>
                <svg width="27" height="13" viewBox="0 0 27 13">
                    <rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor"
                        opacity=".4" />
                    <rect x="2" y="2" width="14" height="9" rx="2.4" />
                    <path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".4" />
                </svg>
            </span>
        </div>
        <div id="hb" class="light"><i></i></div>
    </div>
    <audio id="player" preload="auto"></audio>
    <audio id="bgm" src="./data/app/bgm.mp3" loop preload="auto"></audio>
    
    <script>
        window.LANG = 'zh';
        
        // 👈 注意：以后每次发版，务必把这个版本号修改一下，比如 a 改 b
        const ASSET_V = '20261104a'; 

        function load(src) {
            return new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src + '?v=' + ASSET_V;
                s.onload = res;
                s.onerror = () => rej(new Error("找不到文件: " + src));
                document.body.appendChild(s);
            });
        }

        (async () => {
            try {
                const scripts = [
                    './data/chat_history.js', 
                    './data/story.js',
                    './core/utils.js',
                    './core/icons.js',
                    './core/audio.js',
                    './core/app.js',
                    './views/home_ui.js',
                    './views/app_extra.js',
                    './views/mail.js',
                    './views/app_photos.js',
                    './views/wx_chat.js',
                    './views/wx_pages.js',
                    './views/wx_moments.js',
                    './views/app_weibo.js',
                    './views/app_xianyu.js',
                    './views/app_bilibili.js',
                    './views/app_xhs.js'
                ];

                // 1. 预热下载 JS 脚本
                await Promise.all(scripts.map((src) => fetch(src + '?v=' + ASSET_V).catch(() => {})));

                // 2. 按顺序执行 JS
                for (const src of scripts) {
                    await load(src);
                }

                // 3. 启动系统，渲染主屏幕
                initApp();
                
                // 4. 👇 核心：强行抓取主屏的图标和壁纸，全部下完再放人
                await preloadHomeAssets();

                // 5. 掀开遮罩层
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        const oldBoot = document.getElementById('boot');
                        if (oldBoot) oldBoot.style.display = 'none'; // 防止穿帮
                    }, 500);
                }

            } catch (e) {
                console.error(e);
                const overlay = document.getElementById('loading-overlay');
                if (overlay) overlay.style.display = 'none';
                alert('加载失败，请检查文件是否齐全或是否有语法错误：\n' + e.message);
            }
        })();

        // =========================================
        // 👇 主屏资源预加载：防止 App 图标白块
        // =========================================
        async function preloadHomeAssets() {
            // 给 DOM 一点时间渲染出图标标签
            await new Promise(r => setTimeout(r, 150));

            const imgPromises = [];

            // 抓取主屏上所有的 <img> 标签（包括微博、B站图标等）
            document.querySelectorAll('img').forEach(img => {
                if (!img.complete) {
                    imgPromises.push(new Promise(resolve => {
                        img.onload = resolve;
                        img.onerror = resolve; // 404 报错也放行
                    }));
                }
            });

            // 抓取壁纸
            const wallEl = document.getElementById('wall');
            if (wallEl) {
                const bg = window.getComputedStyle(wallEl).backgroundImage;
                const match = bg.match(/url\(["']?([^"']+)["']?\)/);
                if (match && match[1] && !match[1].includes('gradient')) {
                    imgPromises.push(new Promise(resolve => {
                        const img = new Image();
                        img.onload = resolve;
                        img.onerror = resolve;
                        img.src = match[1];
                    }));
                }
            }

            // 兜底时间：最多等 2.5 秒。如果图实在太大没下完，2.5秒后也强行放行。
            const timeout = new Promise(r => setTimeout(r, 2500));
            await Promise.race([Promise.all(imgPromises), timeout]);
        }
    </script>
</body>

</html>
