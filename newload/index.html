        <div id="sb" class="light">

            <span class="r">

    <audio id="player" preload="auto"></audio>
    <audio id="bgm" src="./data/app/bgm.mp3" loop preload="auto"></audio>
    
    <script>
        window.LANG = 'zh';
        
        // 本地测试用，云端构建会自动替换时间戳
        const ASSET_V = '20261108h';

        function load(src) {
            return new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src + '?v=' + ASSET_V;
                s.onload = res;
                s.onerror = () => rej(new Error("找不到文件: " + src));
                document.body.appendChild(s);
            });
        }

        (async () => {
            try {
                // 记录开始加载的时间
                const startTime = Date.now();
                
                const scripts = [
                    './data/chat_history.js', './data/story.js', './core/utils.js', './core/icons.js', 
                    './core/audio.js', './core/app.js', './views/home_ui.js', './views/app_extra.js', 
                    './views/mail.js', './views/app_photos.js', './views/wx_chat.js', './views/wx_pages.js', 
                    './views/wx_moments.js', './views/app_weibo.js', './views/app_xianyu.js', 
                    './views/app_bilibili.js', './views/app_xhs.js'
                ];

                // 1. 并发高速下载，按顺序执行
                await Promise.all(scripts.map(src => fetch(src + '?v=' + ASSET_V).catch(() => {})));
                for (const src of scripts) { await load(src); }

                // 2. 启动系统
                initApp();
                
                // 3. 加载主屏资源（最长等 3 秒）
                await preloadHomeAssets();

                // 👇 4. 核心修改：强制遮罩层至少停留 2 秒
                const minDisplayTime = 2000; 
                const elapsedTime = Date.now() - startTime;
                if (elapsedTime < minDisplayTime) {
                    // 如果加载太快，就强行再等一会儿
                    await new Promise(r => setTimeout(r, minDisplayTime - elapsedTime));
                }

                // 5. 掀开遮罩层
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        const oldBoot = document.getElementById('boot');
                        if (oldBoot) oldBoot.style.display = 'none'; 
                    }, 300); // 等待淡出动画
                }

                // 6. 玩家进去后，后台开始 VIP 排队下载图片
                backgroundPreload();

            } catch (e) {
                console.error(e);
                const overlay = document.getElementById('loading-overlay');
                if (overlay) overlay.style.display = 'none';
                alert('加载失败：\n' + e.message);
            }
        })();

        async function preloadHomeAssets() {
            const imgPromises = [];
            const urlsToLoad = new Set();
            await new Promise(r => setTimeout(r, 100)); 

            document.querySelectorAll('#homeL img').forEach(img => {
                if (img.src) urlsToLoad.add(img.src);
            });
            document.querySelectorAll('#homeL *').forEach(el => {
                const bg = window.getComputedStyle(el).backgroundImage;
                if (bg && bg !== 'none' && bg.includes('url(')) {
                    const match = bg.match(/url\(["']?([^"']+)["']?\)/);
                    if (match && match[1]) urlsToLoad.add(match[1]);
                }
            });
            urlsToLoad.forEach(src => {
                imgPromises.push(new Promise(resolve => {
                    const img = new Image();
                    img.onload = resolve; img.onerror = resolve;
                    img.src = src;
                }));
            });
            const timeout = new Promise(r => setTimeout(r, 3000));
            await Promise.race([Promise.all(imgPromises), timeout]);
        }

        window.priorityPreload = function(urls) {
            if (!urls || !urls.length) return;
            const uniqueUrls = [...new Set(urls)].filter(src => src && src.length > 5);
            uniqueUrls.forEach(src => {
                if (/\.(mp4|mp3|wav|m4a)$/i.test(src)) {
                    const link = document.createElement('link');
                    link.rel = 'prefetch'; link.href = src;
                    document.head.appendChild(link);
                } else {
                    const img = new Image();
                    img.src = src; 
                }
            });
        };

        function backgroundPreload() {
            setTimeout(() => {
                const queue = [];
                if (window.CHAT_HISTORY) {
                    const vipRoles = ["穆祉丞", "恩恩", "丞哥", "MuAMuA", "cat", "rabbit"];
                    vipRoles.forEach(role => {
                        const msgs = window.CHAT_HISTORY[role];
                        if (Array.isArray(msgs)) {
                            msgs.forEach(msg => {
                                if (Array.isArray(msg) && typeof msg[0] === 'string') {
                                    const text = msg[0];
                                    if (text.startsWith('[图片] ') || text.startsWith('[表情] ')) queue.push(text.slice(4).trim());
                                    else if (text.startsWith('[视频] ')) { queue.push(text.slice(4).split('|')[0].trim()); }
                                }
                            });
                        }
                    });
                }
                if (window.MOCK_MOMENTS_DATA) {
                    Object.values(window.MOCK_MOMENTS_DATA).forEach(role => {
                        if (role.posts) role.posts.forEach(post => {
                            if (post.images) post.images.forEach(src => queue.push(src));
                        });
                    });
                }
                if (window.MOCK_PHOTOS) window.MOCK_PHOTOS.forEach(i => { if (i.src) queue.push(i.src); });

                const finalQueue = [...new Set(queue)].filter(src => src && src.length > 5);
                let index = 0;
                function loadNextBatch() {
                    if (index >= finalQueue.length) return;
                    const batch = finalQueue.slice(index, index + 6); // 后台并发 6 个
                    index += 6;
                    let loaded = 0;
                    batch.forEach(src => {
                        const img = new Image();
                        img.onload = img.onerror = () => { if (++loaded === batch.length) setTimeout(loadNextBatch, 100); };
                        img.src = src;
                    });
                }
                loadNextBatch();
            }, 10000); 
        }
    </script>
</body>
