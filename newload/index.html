        <script>
        window.LANG = 'zh';
        
        // 统一的加载函数
        // ⚠️ 改完代码要发版时把这个版本号 +1，浏览器才会重新拉取脚本
        const ASSET_V = '20261029g';

        function load(src) {
            return new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src + '?v=' + ASSET_V; // 固定版本号，允许浏览器缓存
                s.onload = res;
                s.onerror = () => rej(new Error("找不到文件: " + src));
                document.body.appendChild(s);
            });
        }

        (async () => {
            try {
                // 👇 核心加载顺序（数组格式，以后加新文件直接在这里加一行就行）
                const scripts = [
                    // 1. 数据层与工具
                    './data/chat_history.js', 
                    './data/story.js',
                    './core/utils.js',
                    './core/icons.js',
                    './core/audio.js',
                    './core/app.js',
                    './views/home_ui.js',
                    './views/app_extra.js',

                    // 3. 基础组件与杂项（包含日历、时钟、电话、相册、备忘录等所有系统级组件）
                    
                    //'./views/app_safari.js',
                    //'./views/app_music.js',
                    //'./views/app_map.js',


                    './views/mail.js',
                    './views/app_photos.js',

                    // 4. 独立 App 模块
                    './views/wx_chat.js',
                    './views/wx_pages.js',
                    './views/wx_moments.js',
                    './views/app_weibo.js',
                    './views/app_xianyu.js',
                    './views/app_bilibili.js',
                    './views/app_xhs.js'
                ];

                // 先并行预热下载，再按顺序执行，避免一个个串行等待
                await Promise.all(
                    scripts.map((src) =>
                        fetch(src + '?v=' + ASSET_V).catch(() => {})
                    )
                );

                // 循环按顺序加载
                for (const src of scripts) {
                    console.log("⏳ 正在加载: " + src);
                    await load(src);
                }

                // 全部加载完毕，启动系统
                console.log("✅ 所有模块加载完毕，启动系统！");
                initApp();
                
            } catch (e) {
                console.error(e);
                // 如果某个文件没找到或者有语法错误，直接弹窗告诉你具体是哪个文件
                alert('加载失败，请检查文件是否齐全或是否有语法错误：\n' + e.message);
            }
        })();
    </script>
