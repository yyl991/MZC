    <script>
        window.LANG = 'zh';
        
        // 👈 注意：以后每次发版，务必把这个版本号修改一下，比如 a 改 b
        const ASSET_V = '20261104b'; 

        function load(src) {
            return new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src + '?v=' + ASSET_V;
                s.onload = res;
                s.onerror = () => rej(new Error("找不到文件: " + src));
                document.body.appendChild(s);
            });
        }

        (async () => {
            try {
                const scripts = [
                    './data/chat_history.js', 
                    './data/story.js',
                    './core/utils.js',
                    './core/icons.js',
                    './core/audio.js',
                    './core/app.js',
                    './views/home_ui.js',
                    './views/app_extra.js',
                    './views/mail.js',
                    './views/app_photos.js',
                    './views/wx_chat.js',
                    './views/wx_pages.js',
                    './views/wx_moments.js',
                    './views/app_weibo.js',
                    './views/app_xianyu.js',
                    './views/app_bilibili.js',
                    './views/app_xhs.js'
                ];

                // 1. 预热下载 JS 脚本
                await Promise.all(scripts.map((src) => fetch(src + '?v=' + ASSET_V).catch(() => {})));

                // 2. 按顺序执行 JS
                for (const src of scripts) {
                    await load(src);
                }

                // 3. 启动系统，渲染主屏幕
                initApp();
                
                // 4. 强行抓取主屏的图标和壁纸，全部下完再放人
                await preloadHomeAssets();

                // 5. 掀开遮罩层
                const overlay = document.getElementById('loading-overlay');
                if (overlay) {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        const oldBoot = document.getElementById('boot');
                        if (oldBoot) oldBoot.style.display = 'none'; 
                    }, 500);
                }

                // 6. 👇 核心：掀开遮罩后，让浏览器在后台悄悄下载微信/朋友圈的图
                backgroundPreload();

            } catch (e) {
                console.error(e);
                const overlay = document.getElementById('loading-overlay');
                if (overlay) overlay.style.display = 'none';
                alert('加载失败，请检查文件是否齐全或是否有语法错误：\n' + e.message);
            }
        })();

        // =========================================
        // 👇 预加载1：主屏资源（阻塞加载，防白块）
        // =========================================
        async function preloadHomeAssets() {
            await new Promise(r => setTimeout(r, 150));
            const imgPromises = [];

            document.querySelectorAll('img').forEach(img => {
                if (!img.complete) {
                    imgPromises.push(new Promise(resolve => {
                        img.onload = resolve; img.onerror = resolve;
                    }));
                }
            });

            const wallEl = document.getElementById('wall');
            if (wallEl) {
                const bg = window.getComputedStyle(wallEl).backgroundImage;
                const match = bg.match(/url\(["']?([^"']+)["']?\)/);
                if (match && match[1] && !match[1].includes('gradient')) {
                    imgPromises.push(new Promise(resolve => {
                        const img = new Image();
                        img.onload = resolve; img.onerror = resolve;
                        img.src = match[1];
                    }));
                }
            }

            const timeout = new Promise(r => setTimeout(r, 2500));
            await Promise.race([Promise.all(imgPromises), timeout]);
        }

        // =========================================
        // 👇 预加载2：后台静默下载（不阻塞，进去微信秒出图）
        // =========================================
        function backgroundPreload() {
            setTimeout(() => {
                const urls = new Set();

                // 1. 收集相册的图
                if (window.MOCK_PHOTOS) {
                    window.MOCK_PHOTOS.forEach(i => { if (i.src) urls.add(i.src); });
                }
                // 收集私密相册
                if (window.CFG && window.CFG.privateAlbum) {
                    window.CFG.privateAlbum.forEach(i => { if (i.src) urls.add(i.src); });
                }

                // 2. 收集朋友圈的图
                if (window.MOCK_MOMENTS_DATA) {
                    Object.values(window.MOCK_MOMENTS_DATA).forEach(role => {
                        if (role.posts) {
                            role.posts.forEach(post => {
                                if (post.images) post.images.forEach(src => urls.add(src));
                            });
                        }
                    });
                }

                // 3. 收集聊天记录里的图（通过正则解析数组）
                if (window.CHAT_HISTORY) {
                    Object.values(window.CHAT_HISTORY).forEach(msgs => {
                        if (Array.isArray(msgs)) {
                            msgs.forEach(msg => {
                                if (Array.isArray(msg) && typeof msg[0] === 'string') {
                                    const text = msg[0];
                                    if (text.startsWith('[图片] ') || text.startsWith('[表情] ')) {
                                        urls.add(text.slice(4).trim());
                                    } else if (text.startsWith('[视频] ')) {
                                        const parts = text.slice(4).split('|');
                                        urls.add(parts[0].trim()); // 视频路径
                                        if (parts[1]) urls.add(parts[1].trim()); // 封面图
                                    } else if (text.startsWith('[语音] ')) {
                                        const parts = text.slice(4).split('|');
                                        if (parts[1]) urls.add(parts[1].trim()); // 音频路径
                                    }
                                }
                            });
                        }
                    });
                }

                // 开始静默下载
                let count = 0;
                urls.forEach(src => {
                    if (!src || src.length < 5) return;
                    count++;
                    
                    // 如果是视频/音频，用 prefetch 悄悄下
                    if (/\.(mp4|mp3|wav|m4a)$/i.test(src)) {
                        const link = document.createElement('link');
                        link.rel = 'prefetch';
                        link.href = src;
                        document.head.appendChild(link);
                    } else {
                        // 如果是图片，用 Image 对象悄悄下
                        const img = new Image();
                        img.src = src;
                    }
                });
                
                console.log(`📦 后台已开始静默预加载 ${count} 个内部资源...`);

            }, 1500); // 延迟 1.5 秒开始，不抢占首屏的网速
        }
    </script>
