<div id="island"><span class="ia"></span><span class="ib"><i></i><i></i><i></i><i></i></span></div>
-->

    <audio id="player" preload="auto"></audio>
    <script>
        window.LANG = 'zh';
        function load(src) {
            return new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s);
            });
        }
        (async () => {
            try {
                await load('chat_history.js'); 
                await load('story.zh.js');
                await load('utils.js');
                await load('app.js');
                await load('chat.js');
                await load('data_extra.js');
                initApp();
            } catch (e) {
                alert('加载失败，请检查文件是否齐全: ' + e);
            }
        })();
    </script>
</body>

</html>
