</head>

<body>
    <div id="phone">

            </div>

            <div id="ov"></div>
        </div>
        <div id="sb" class="light">
            <button id="sbk" aria-label="Home"></button>
            <span class="t" id="sbt">23:09</span>
            <span class="r">
                <svg width="18" height="12" viewBox="0 0 18 12">
                    <rect x="0" y="8" width="3" height="4" rx="1" />
                    <rect x="5" y="5.5" width="3" height="6.5" rx="1" />
                    <rect x="10" y="3" width="3" height="9" rx="1" />
                    <rect x="15" y="0" width="3" height="12" rx="1" />
                </svg>
                <svg width="16" height="12" viewBox="0 0 16 12">
                    <path
                        d="M8 2.3c2.3 0 4.4.9 6 2.4l1.2-1.2A10.3 10.3 0 0 0 8 .6 10.3 10.3 0 0 0 .8 3.5L2 4.7a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 4a6.8 6.8 0 0 0-4.8 1.9l1.2 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.4c-.6 0-1.2.2-1.6.6L8 11.3l1.6-1.6c-.4-.4-1-.6-1.6-.6Z" />

                <svg width="27" height="13" viewBox="0 0 27 13">

                        opacity=".4" />

                </svg>
            </span>
        </div>
        <!-- 把灵动岛隐藏了，以后想用再去掉两边的符号
<div id="island"><span class="ia"></span><span class="ib"><i></i><i></i><i></i><i></i></span></div>
-->
        <div id="hb" class="light"><i></i></div>
    </div>
    <audio id="player" preload="auto"></audio>
    <!-- 👇 新增：背景音乐 -->
    <audio id="bgm" src="./data/app/bgm.wav" loop></audio>
    <script>
        window.LANG = 'zh';
        function load(src) {
            return new Promise((res, rej) => {
                const s = document.createElement('script');
                // 👇 加上 ?v=时间戳，强迫浏览器每次重新下载最新的 JS 文件
                s.src = src + '?v=' + new Date().getTime(); 
                s.onload = res; 
                s.onerror = rej; 
                document.body.appendChild(s);
            });
        }
        (async () => {
            try {
            // 1. 核心数据层
            await load('chat_history.js'); 
            await load('story.js');
            await load('utils.js');

            // 2. 操作系统核心
            await load('app.js');

            
            // 👇 新增：注入主屏幕自定义 UI
            await load('home_ui.js');
            
            // 👇 你刚才拆出来的新模块，加在这里
            await load('app_safari.js');   // 浏览器
            await load('app_music.js');    // 音乐播放器
            await load('app_map.js');     // 交互式地图

                        // 3. 独立 App 模块 (互不干涉)
            await load('app_wechat.js');   // 微信
            await load('app_weibo.js');    // 微博
            await load('app_xianyu.js');   // 闲鱼
            await load('app_bilibili.js'); // 👈 新增：B站
            await load('app_xhs.js');      // 👈 新增：小红书
            await load('app_photos.js');   // 👈 新增：相册 & 私密相册
            await load('app_extra.js');   // 杂项：短信、天气等
            await load('mail.js');         // 独立的邮件
            //await load('app_paopao.js');
            // 4. 全部加载完毕，启动系统 
                initApp();
            } catch (e) {
                alert('加载失败，请检查文件是否齐全: ' + e);
            }
        })();
    </script>
</body>

</html>
