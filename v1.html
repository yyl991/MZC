<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>请选择一部手机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#000;color:#fff;overflow:hidden;height:100vh;}

/* ==========【开局：手机选择总页面】 ========== */
#selectPage{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
#selectPage.hide{display:none;}
.select-title{font-size:22px;margin-bottom:40px;}
.phone-item{width:280px;padding:16px 20px;border:1px solid #444;border-radius:12px;margin-bottom:14px;cursor:pointer;}
.phone-item:active{background:#222;}
.phone-name{font-size:17px;margin-bottom:4px;}
.phone-desc{font-size:13px;opacity:0.6;}

/* ========== 手机锁屏 ========== */
#lock{position:fixed;inset:0;background:#111;z-index:9990;display:flex;flex-direction:column;align-items:center;padding-top:80px;}
#lock.hide{display:none;}
.lock-time{font-size:64px;font-weight:200;margin:8px 0;}
.lock-date{font-size:18px;opacity:0.8;margin-bottom:60px;}
.pwd-wrap{display:flex;gap:12px;margin-bottom:40px;}
.pwd-dot{width:14px;height:14px;border-radius:50%;border:1px solid #fff;}
.pwd-dot.on{background:#fff;}
.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:16px;}
.key{width:70px;height:70px;border-radius:50%;background:#333;display:grid;place-items:center;font-size:24px;cursor:pointer;user-select:none;color:#fff;}
.key:active{background:#666;}
.key.empty{background:transparent;}
.lock-tip{margin-top:20px;font-size:13px;opacity:0.5;}

/* ==========手机桌面========== */
#home{width:100vw;height:100vh;background:#222;display:none;padding-top:60px;}
#home.show{display:block;}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:20px;}
.app{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.app-icon{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin-bottom:6px;}
.wechat-icon{background:#07c160;}
.memo-icon{background:#ffcc00;}
.photo-icon{background:#8a8a8a;}
.phone-icon{background:#34c759;}
.rec-icon{background:#9c27b0;}
.app-name{font-size:12px;}

/* ==========应用页面通用========== */
.app-page{position:fixed;inset:0;background:#f5f5f5;color:#000;z-index:1000;display:none;flex-direction:column;}
.app-page.show{display:flex;}
.app-header{height:50px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #e8e8e8;background:#f7f7f7;}
.back-btn{cursor:pointer;color:#07c160;}
.chat-box{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.msg-self{align-self:flex-end;background:#95ec69;padding:8px 12px;border-radius:6px;max-width:72%;}
.msg-other{align-self:flex-start;background:#ffffff;padding:8px 12px;border-radius:6px;max-width:72%;border:1px solid #e6e6e6;}
.send-options{padding:12px;border-top:1px solid #eee;display:flex;flex-wrap:wrap;gap:8px;background:#fff;}
.opt-btn{padding:8px 12px;border:1px solid #07c160;color:#07c160;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;}

/* ==========模块子锁弹窗（相册锁、录音锁）========== */
#moduleLock{position:fixed;inset:0:rgba(0,0,0,0.9);background:rgba(0,0,0,0.9);z-index:5000;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
#moduleLock.show{display:flex;}
.mod-title{font-size:20px;margin-bottom:20px;}
.mod-dots{display:flex;gap:10px;margin-bottom:30px;}
.mod-dot{width:14px;height:14px;border-radius:50%;border:1px solid #fff;}
.mod-dot.on{background:#fff;}

/* ==========来电弹窗========== */
#call-popup{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9980;display:none;flex-direction:column;align-items:center;justify-content:center;}
#call-popup.show{display:flex;}
.call-name{font-size:32px;margin:16px 0;color:#fff;}
.call-avatar{width:100px;height:100px;border-radius:50%;background:#666;}
.call-buttons{display:flex;gap:60px;margin-top:60px;}
.call-accept,.call-reject{width:70px;height:70px;border-radius:50%;border:none;color:#fff;font-size:22px;cursor:pointer;}
.call-accept{background:#34c759;}
.call-reject{background:#ff3b30;}
</style>
</head>
<body>

<!-- 【开局：选择手机页面】 -->
<div id="selectPage">
  <div class="select-title">请选择一部手机</div>
  <div class="phone-item" data-phone="phone1">
    <div class="phone-name">第一个手机</div>
    <div class="phone-desc">可查看，无额外锁</div>
  </div>
  <div class="phone-item" data-phone="phone2">
    <div class="phone-name">第二个手机</div>
    <div class="phone-desc">整机可进，相册需解锁</div>
  </div>
  <div class="phone-item" data-phone="phone3">
    <div class="phone-name">第三个手机</div>
    <div class="phone-desc">整机可进，私密录音需解锁</div>
  </div>
</div>

<!-- 手机整机锁屏 -->
<div id="lock">
  <div class="lock-date">10月21日 星期三</div>
  <div class="lock-time">14:22</div>
  <div class="pwd-wrap" id="pwdDots">
    <div class="pwd-dot"></div><div class="pwd-dot"></div><div class="pwd-dot"></div><div class="pwd-dot"></div>
  </div>
  <div class="keypad">
    <div class="key" data-num="1">1</div><div class="key" data-num="2">2</div><div class="key" data-num="3">3</div>
    <div class="key" data-num="4">4</div><div class="key" data-num="5">5</div><div class="key" data-num="6">6</div>
    <div class="key" data-num="7">7</div><div class="key" data-num="8">8</div><div class="key" data-num="9">9</div>
    <div class="key empty"></div><div class="key" data-num="0">0</div><div class="key" data-del>⌫</div>
  </div>
  <div class="lock-tip" id="lockTip"></div>
</div>

<!-- 手机桌面 -->
<div id="home">
  <div class="app-grid">
    <div class="app" data-app="wechat"><div class="app-icon wechat-icon">💬</div><div class="app-name">微信</div></div>
    <div class="app" data-app="memo"><div class="app-icon memo-icon">📝</div><div class="app-name">备忘录</div></div>
    <div class="app" data-app="photo"><div class="app-icon photo-icon">🖼️</div><div class="app-name">相册</div></div>
    <div class="app" data-app="phone"><div class="app-icon phone-icon">📞</div><div class="app-name">电话</div></div>
    <div class="app" data-app="recorder"><div class="app-icon rec-icon">🎙️</div><div class="app-name">私密录音</div></div>
  </div>
</div>

<!-- 微信聊天页 -->
<div class="app-page" id="page-wechat">
  <div class="app-header"><span class="back-btn" data-back>返回</span><span style="margin-left:12px;">角色</span></div>
  <div class="chat-box" id="chatBox"></div>
  <div class="send-options" id="optWrap">
    <button class="opt-btn" data-reply="刚刚在忙">刚刚在忙</button>
    <button class="opt-btn" data-reply="怎么啦？">怎么啦？</button>
    <button class="opt-btn" data-reply="晚点再说">晚点再说</button>
  </div>
</div>

<!-- 备忘录 -->
<div class="app-page" id="page-memo">
  <div class="app-header"><span class="back-btn" data-back>返回</span><span>备忘录</span></div>
  <div style="padding:16px;color:#333;">
    <p>线索可以写在这里，提示模块密码</p>
  </div>
</div>

<!-- 相册 -->
<div class="app-page" id="page-photo">
  <div class="app-header"><span class="back-btn" data-back>返回</span><span>相册</span></div>
  <div style="padding:16px;color:#333;">
    <p>【相册私密照片内容，需要解锁才可见】</p>
  </div>
</div>

<!-- 电话 -->
<div class="app-page" id="page-phone">
  <div class="app-header"><span class="back-btn" data-back>返回</span><span>通话记录</span></div>
  <div style="padding:16px;color:#333;"><p>通话记录列表</p></div>
</div>

<!-- 私密录音 -->
<div class="app-page" id="page-recorder">
  <div class="app-header"><span class="back-btn" data-back>返回</span><span>私密录音</span></div>
  <div style="padding:16px;color:#333;">
    <p>【录音文本内容，解锁后查看】</p>
  </div>
</div>

<!-- 模块独立密码弹窗（相册锁 /录音锁共用） -->
<div id="moduleLock">
  <div class="mod-title" id="modLockTitle">输入密码解锁</div>
  <div class="mod-dots" id="modDots">
    <div class="mod-dot"></div><div class="mod-dot"></div><div class="mod-dot"></div><div class="mod-dot"></div>
  </div>
  <div class="keypad">
    <div class="key" data-modnum="1">1</div><div class="key" data-modnum="2">2</div><div class="key" data-modnum="3">3</div>
    <div class="key" data-modnum="4">4</div><div class="key" data-modnum="5">5</div><div class="key" data-modnum="6">6</div>
    <div class="key" data-modnum="7">7</div><div class="key" data-modnum="8">8</div><div class="key" data-modnum="9">9</div>
    <div class="key empty"></div><div class="key" data-modnum="0">0</div><div class="key" data-moddel>⌫</div>
  </div>
</div>

<!-- 来电弹窗 -->
<div id="call-popup">
  <div class="call-avatar"></div>
  <div class="call-name">来电</div>
  <div class="call-buttons">
    <button class="call-reject" id="rejectBtn">拒接</button>
    <button class="call-accept" id="acceptBtn">接听</button>
  </div>
</div>

<script>
// ========== 三台手机配置，在这里修改密码 ==========
const PHONE_CONFIG = {
  phone1:{ lockPwd:"1111", photoPwd:null, recPwd:null }, //手机1：整机密码1111，相册录音无锁
  phone2:{ lockPwd:"2222", photoPwd:"2233", recPwd:null },//手机2：整机2222；相册单独密码2233；录音无锁
  phone3:{ lockPwd:"3333", photoPwd:null, recPwd:"3344" } //手机3：整机3333；录音单独密码3344；相册无锁
};
let currentPhoneId = null; // 当前选中哪台手机

// 状态存储key
const ST_KEY_SELECT = "selectPhoneId";
const ST_KEY_PHONE_UNLOCK = pid=>`phone_${pid}_unlock`;
const ST_KEY_PHOTO_UNLOCK = pid=>`phone_${pid}_photo`;
const ST_KEY_REC_UNLOCK = pid=>`phone_${pid}_rec`;

// DOM
const selectPage = document.getElementById("selectPage");
const lock = document.getElementById("lock");
const home = document.getElementById("home");
const pwdDots = document.querySelectorAll('#pwdDots .pwd-dot');
const lockTip = document.getElementById("lockTip");
const moduleLock = document.getElementById("moduleLock");
const modLockTitle = document.getElementById("modLockTitle");
const modDots = document.querySelectorAll("#modDots .mod-dot");
let inputPwd = "";
let modInputPwd = "";
let activeModType = null; // "photo" / "recorder"

// 页面加载：读取上次选的手机
window.onload = ()=>{
  const savedPhone = localStorage.getItem(ST_KEY_SELECT);
  if(savedPhone && PHONE_CONFIG[savedPhone]){
    enterPhone(savedPhone);
  }
}

// 点击选择手机
document.querySelectorAll(".phone-item").forEach(el=>{
  el.onclick = ()=>{
    const pid = el.dataset.phone;
    enterPhone(pid);
  }
})

function enterPhone(pid){
  currentPhoneId = pid;
  localStorage.setItem(ST_KEY_SELECT,pid);
  selectPage.classList.add("hide");
  const cfg = PHONE_CONFIG[pid];
  lockTip.innerText = `【${pid}】整机锁屏`;
  inputPwd = ""; refreshDot();
  // 判断整机是否已经解锁
  if(localStorage.getItem(ST_KEY_PHONE_UNLOCK(pid)) === "yes"){
    lock.classList.add("hide"); home.classList.add("show");
    triggerRandomCall();
  }else{
    lock.classList.remove("hide"); home.classList.remove("show");
  }
}

// 整机锁屏键盘
document.querySelectorAll('.key[data-num]').forEach(k=>{
  k.onclick = ()=>{
    if(inputPwd.length >=4) return;
    inputPwd += k.dataset.num; refreshDot();
    if(inputPwd.length ===4){
      setTimeout(()=>{
        const cfg = PHONE_CONFIG[currentPhoneId];
        if(inputPwd === cfg.lockPwd){
          localStorage.setItem(ST_KEY_PHONE_UNLOCK(currentPhoneId),"yes");
          lock.classList.add("hide"); home.classList.add("show");
          triggerRandomCall();
        }else{
          inputPwd = ""; refreshDot(); alert("整机密码错误");
        }
      },220)
    }
  }
})
document.querySelector('.key[data-del]').onclick = ()=>{ inputPwd=inputPwd.slice(0,-1); refreshDot(); }
function refreshDot(){ pwdDots.forEach((d,i)=>d.classList.toggle('on',i<inputPwd.length)); }

// APP点击打开
document.querySelectorAll('.app').forEach(app=>{
  app.onclick = ()=>{
    const aid = app.dataset.app;
    const cfg = PHONE_CONFIG[currentPhoneId];
    // 相册：手机2需要单独锁
    if(aid==="photo" && cfg.photoPwd){
      if(localStorage.getItem(ST_KEY_PHOTO_UNLOCK(currentPhoneId))!=="yes"){
        openModuleLock("photo","请输入相册密码");
        return;
      }
    }
    // 私密录音：手机3需要单独锁
    if(aid==="recorder" && cfg.recPwd){
      if(localStorage.getItem(ST_KEY_REC_UNLOCK(currentPhoneId))!=="yes"){
        openModuleLock("recorder","请输入私密录音密码");
        return;
      }
    }
    document.getElementById(`page-${aid}`).classList.add('show');
  }
})
// 返回按钮
document.querySelectorAll('[data-back]').forEach(b=>{
  b.onclick = ()=>{ b.closest('.app-page').classList.remove('show'); }
})

// =========模块独立密码弹窗（相册/录音）==========
function openModuleLock(type,title){
  activeModType = type;
  modLockTitle.innerText = title;
  modInputPwd = ""; refreshModDot();
  moduleLock.classList.add("show");
}
document.querySelectorAll('.key[data-modnum]').forEach(k=>{
  k.onclick = ()=>{
    if(modInputPwd.length>=4) return;
    modInputPwd += k.dataset.modnum; refreshModDot();
    if(modInputPwd.length===4){
      setTimeout(()=>{
        const cfg = PHONE_CONFIG[currentPhoneId];
        let correct;
        if(activeModType==="photo") correct = cfg.photoPwd;
        if(activeModType==="recorder") correct = cfg.recPwd;
        if(modInputPwd === correct){
          if(activeModType==="photo") localStorage.setItem(ST_KEY_PHOTO_UNLOCK(currentPhoneId),"yes");
          if(activeModType==="recorder") localStorage.setItem(ST_KEY_REC_UNLOCK(currentPhoneId),"yes");
          moduleLock.classList.remove("show");
          // 解锁成功直接打开对应页面
          document.getElementById(`page-${activeModType}`).classList.add('show');
        }else{
          modInputPwd = ""; refreshModDot(); alert("模块密码错误");
        }
      },220)
    }
  }
})
document.querySelector('.key[data-moddel]').onclick = ()=>{ modInputPwd=modInputPwd.slice(0,-1); refreshModDot(); }
function refreshModDot(){ modDots.forEach((d,i)=>d.classList.toggle('on',i<modInputPwd.length)); }

// =========微信聊天逻辑==========
const chatBox = document.getElementById('chatBox');
const optWrap = document.getElementById('optWrap');
function addMsg(text, isSelf=false){
  const div = document.createElement('div');
  div.className = isSelf ? "msg-self" : "msg-other";
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
const replyMap = {
  "刚刚在忙": "原来是这样，那你先忙哈",
  "怎么啦？": "没事，就是想找你聊聊天",
  "晚点再说": "好，那我等你有空"
}
optWrap.querySelectorAll('.opt-btn').forEach(btn=>{
  btn.onclick = ()=>{
    const sendText = btn.dataset.reply;
    addMsg(sendText, true);
    setTimeout(()=>{ addMsg(replyMap[sendText]); }, 800)
  }
})

// =========来电逻辑==========
const callPopup = document.getElementById('call-popup');
function triggerRandomCall(){
  setTimeout(()=>{ callPopup.classList.add('show'); },7000)
}
document.getElementById('acceptBtn').onclick = ()=>{
  callPopup.classList.remove('show'); addMsg("（接通电话）",true);
}
document.getElementById('rejectBtn').onclick = ()=>{
  callPopup.classList.remove('show');
  setTimeout(()=>{ addMsg("是不是在忙？怎么不接电话",false); },1200)
}
</script>
</body>
</html>
